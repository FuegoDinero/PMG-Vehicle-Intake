<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><meta name="apple-mobile-web-app-capable" content="yes"><title>PMG Vehicle Operations</title>
<style>
:root{--bg:#08090b;--panel:#111317;--panel2:#171a20;--line:#292e37;--text:#f5f7fa;--muted:#9aa3af;--good:#4ade80;--warn:#fbbf24;--bad:#fb7185;--info:#60a5fa;--r:18px}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.splash{position:fixed;inset:0;background:#050505;z-index:99;display:grid;place-items:center;animation:out .7s 2.3s forwards}.splash>div{text-align:center}.mark{width:84px;height:84px;border:2px solid white;border-radius:24px;display:grid;place-items:center;font-weight:900;font-size:25px;letter-spacing:-2px;margin:auto}.splash h1{font-size:20px;letter-spacing:2px;margin:18px 0 5px}.splash p{font-size:10px;letter-spacing:2px;color:#777;text-transform:uppercase;margin:0}@keyframes out{to{opacity:0;visibility:hidden}}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:20px 14px;background:#0a0c0f}.brand{display:flex;align-items:center;gap:10px;padding:5px 8px 22px}.brand .mark{width:42px;height:42px;border-radius:12px;font-size:14px;margin:0}.brand b{font-size:13px}.brand small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aeb6c2;padding:12px;border-radius:12px;text-align:left}.nav button.active,.nav button:hover{background:var(--panel2);color:white}.main{width:100%;max-width:1450px;margin:auto;padding:20px 24px 45px;min-width:0}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}.eyebrow{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1.5px}.top h1{margin:4px 0;font-size:28px;letter-spacing:-.7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:white;border-radius:12px;padding:10px 13px}.btn.primary{background:white;color:#090a0c;border-color:white;font-weight:700}.page{display:none}.page.active{display:block}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.kpi,.section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}.kpi{padding:15px}.kpi small{color:var(--muted);font-size:10px}.kpi strong{display:block;font-size:27px;margin:6px 0}.section{margin-top:16px;overflow:hidden}.head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.head h2{margin:0;font-size:14px}.head p{margin:4px 0 0;color:var(--muted);font-size:10px}.toolbar{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.input,.select,.area{background:#0b0d10;color:white;border:1px solid var(--line);border-radius:11px;padding:10px 11px;outline:none;width:100%}.toolbar .input{max-width:320px}.toolbar .select{width:auto;min-width:150px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:11px;padding:14px}.card{background:#0d0f12;border:1px solid var(--line);border-radius:15px;padding:13px}.card h3{font-size:14px;margin:0 0 4px}.card p{font-size:10px;color:var(--muted);margin:0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.avatar{width:42px;height:32px;border-radius:9px;background:#252b34;display:grid;place-items:center}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0}.badge{font-size:9px;padding:5px 7px;border-radius:999px;background:#20252d;color:#dce2ea}.good{background:#10311e;color:#8cf0ad}.warn{background:#34290c;color:#ffd76a}.bad{background:#38131c;color:#ff9aaa}.info{background:#102943;color:#9bc7ff}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}.list{padding:12px;display:grid;gap:8px}.item{border:1px solid var(--line);background:#0d0f12;border-radius:12px;padding:11px;font-size:11px}.item p{color:#c1c8d1;line-height:1.45;margin:6px 0 0}.tablewrap{overflow:auto}.table{width:100%;min-width:740px;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:11px}.table th{font-size:9px;color:var(--muted);text-transform:uppercase}.detail{padding:17px}.detailHead{padding:17px;display:flex;justify-content:space-between;gap:15px}.detailHead h2{margin:2px 0;font-size:24px}.detailHead p{color:var(--muted);font-size:11px;margin:6px 0}.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);padding:0 17px;overflow:auto}.tabs button{border:0;background:transparent;color:var(--muted);padding:12px;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.active{color:white;border-color:white}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#0d0f12;border:1px solid var(--line);border-radius:12px;padding:11px}.mini span{font-size:9px;color:var(--muted)}.mini b{display:block;margin-top:4px;font-size:14px}.motSearch{display:flex;gap:8px;padding:15px}.motSearch .input{flex:1}.empty{text-align:center;color:var(--muted);padding:35px 15px}.form{display:grid;gap:12px;padding:17px}.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.full{grid-column:1/-1}.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:15px}.theme{border:1px solid var(--line);border-radius:13px;background:#0d0f12;color:white;padding:10px;text-align:left}.sw{height:35px;border-radius:8px;margin-bottom:7px}.mobile{display:none}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}.side{display:none}.main{padding:13px 11px 80px}.top h1{font-size:23px}.kpis{grid-template-columns:repeat(2,1fr)}.kpi strong{font-size:22px}.grid3,.fg{grid-template-columns:1fr}.themes{grid-template-columns:repeat(2,1fr)}.mobile{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;height:64px;background:#0c0e11ee;border-top:1px solid var(--line);z-index:30}.mobile button{border:0;background:none;color:#8d96a3;font-size:9px}.mobile button.active{color:white}.hideMob{display:none}}
.scanHero{border:1px solid var(--line);background:linear-gradient(180deg,#14171b,#0d0f12)}.scanButton{display:block;width:100%;text-align:center;font-size:16px;padding:15px}</head><body>
<div class="splash"><div><div class="mark">PMG</div><h1>PENISTONE MOTOR GROUP</h1><p>Vehicle Operations</p></div></div>
<div class="app"><aside class="side"><div class="brand"><div class="mark">PMG</div><div><b>PMG Vehicle Ops</b><small>Stock & preparation control</small></div></div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="top"><div><div class="eyebrow" id="date"></div><h1 id="title">Home</h1></div><div class="actions"><button class="btn hideMob" onclick="page('scan')">📷 Scan vehicle</button><button class="btn" onclick="page('settings')">⚙</button></div></header>
<section class="page active" id="home">
<div class="section scanHero">
  <div class="head">
    <div><div class="eyebrow">VEHICLE INTAKE</div><h2>Scan a vehicle</h2>
    <p>Start with the registration plate. OCR reads it, then you can check the MOT and continue the intake.</p></div>
    <div class="avatar" style="font-size:28px">📷</div>
  </div>
  <label class="btn primary scanButton">📷 Scan registration plate
    <input id="homeOcrPhoto" type="file" accept="image/*" capture="environment" class="hidden" onchange="runHomeOCR(this)">
  </label>
  <div id="homeOcrStatus" class="empty" style="margin-top:12px">Take a clear photo of the registration plate to begin.</div>
  <div id="homeOcrResult" class="hidden" style="margin-top:12px">
    <div class="field"><label>Detected registration — check before lookup</label>
      <input id="homeOcrReg" class="input" autocapitalize="characters" placeholder="AB12 CDE">
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="btn primary" onclick="useHomeOCR()">Check MOT & continue</button>
      <button class="btn" onclick="page('intake')">Enter manually</button>
    </div>
  </div>
</div>

<div class="kpis">
  <div class="kpi"><small>Cars in this week</small><strong id="kw">0</strong><small>Monday → today</small></div>
  <div class="kpi"><small>Cars prepped</small><strong id="kprep">0</strong><small>prep stages</small></div>
  <div class="kpi"><small>Need attention</small><strong id="ka">0</strong><small>open issues / jobs</small></div>
  <div class="kpi"><small>Ready for pictures</small><strong id="kp">0</strong><small>next queue</small></div>
  <div class="kpi"><small>Done</small><strong id="ks">0</strong><small>workflow complete</small></div>
</div>

<div class="grid2">
  <div class="section"><div class="head"><div><h2>Attention</h2><p>Only vehicles you've added will appear here.</p></div></div><div id="attention" class="list"></div></div>
  <div class="section"><div class="head"><div><h2>This week's workflow</h2><p>Live counts from your vehicle records.</p></div></div><div id="stages" class="list"></div></div>
</div>

<div class="section">
  <div class="head"><div><h2>Weekly cars</h2><p>Vehicles added from Monday. Nothing appears until you add a vehicle.</p></div>
  <button class="btn" onclick="page('stock')">View all stock</button></div>
  <div id="cards" class="cards"></div>
</div>
</section>

<section class="page" id="scan">
<div class="section scanHero">
  <div class="head"><div><div class="eyebrow">VEHICLE INTAKE</div><h2>Scan registration</h2>
  <p>Photograph the number plate. OCR reads the registration so you don't have to type it.</p></div>
  <div class="avatar" style="font-size:28px">📷</div></div>
  <label class="btn primary scanButton">📷 Take / upload plate photo
    <input id="ocrPhoto" type="file" accept="image/*" capture="environment" class="hidden" onchange="runOCR(this)">
  </label>
  <div id="ocrPreview" class="hidden" style="margin-top:12px"><img id="ocrImage" style="width:100%;max-height:320px;object-fit:contain;border-radius:14px;border:1px solid var(--line);background:#08090b"></div>
  <div id="ocrStatus" class="empty" style="margin-top:12px"><strong>Ready to scan</strong><br>Use a clear, straight-on photo.</div>
  <div id="ocrResult" class="hidden" style="margin-top:12px">
    <div class="field"><label>Detected registration — check before lookup</label><input id="ocrReg" class="input" autocapitalize="characters" placeholder="AB12 CDE"></div>
    <div class="actions" style="margin-top:12px"><button class="btn primary" onclick="useOCRRegistration()">Check MOT & continue</button><button class="btn" onclick="page('intake')">Enter manually</button></div>
  </div>
</div>
</section>

<section class="page" id="stock"><div class="section"><div class="head"><div><h2>All stock</h2><p>Filter the whole yard by week and stage.</p></div><button class="btn primary" onclick="page('intake')">＋ Add vehicle</button></div><div class="toolbar"><input id="ss" class="input" placeholder="Search stock…" oninput="stockRender()"><select id="wf" class="select" onchange="stockRender()"></select><select id="sf" class="select" onchange="stockRender()"></select></div><div class="tablewrap"><table class="table"><thead><tr><th>Vehicle</th><th>Intake</th><th>Stage</th><th>MOT</th><th>Open</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div></section>
<section class="page" id="vehicle"><div class="section" id="vehicleBox"></div></section>
<section class="page" id="mot"><div class="section"><div class="head"><div><h2>MOT lookup</h2><p>Registration → secure Cloudflare function → DVSA.</p></div></div><div class="motSearch"><input id="mr" class="input" placeholder="AB12 CDE"><button class="btn primary" onclick="motLookup()">Check MOT</button></div><div id="motOut"></div></div></section>
<section class="page" id="intake"><div class="section"><div class="head"><div><h2>New vehicle intake</h2><p>Capture the vehicle once. Carry the record through every stage.</p></div></div><form id="form" class="form"><div class="fg"><div class="field"><label>Registration *</label><input name="reg" class="input" required></div><div class="field"><label>Make</label><input name="make" class="input"></div><div class="field"><label>Model</label><input name="model" class="input"></div><div class="field"><label>Year</label><input name="year" class="input" type="number"></div><div class="field"><label>Mileage</label><input name="mileage" class="input" type="number"></div><div class="field"><label>Fuel</label><select name="fuel" class="select"><option>Petrol</option><option>Diesel</option><option>Hybrid</option><option>Electric</option><option>Other</option></select></div><div class="field full"><label>Known issues / information left behind</label><textarea name="notes" class="area" rows="4" placeholder="Noise, bodywork, missing items, warning lights…"></textarea></div><div class="field full"><label>Jobs to do</label><textarea name="jobs" class="area" rows="4" placeholder="Oil & filter, tyre, bodywork, valet… one job per line"></textarea></div></div><div class="actions"><button type="button" class="btn" onclick="page('home')">Cancel</button><button class="btn primary">Create vehicle</button></div></form></div></section>
<section class="page" id="settings"><div class="grid2"><div class="section"><div class="head"><div><h2>Appearance</h2><p>Professional themes without changing the workflow.</p></div></div><div class="themes"><button class="theme" onclick="theme('graphite')"><div class="sw" style="background:linear-gradient(135deg,#090a0c,#252a32)"></div><b>Graphite</b></button><button class="theme" onclick="theme('slate')"><div class="sw" style="background:linear-gradient(135deg,#08111d,#2b425d)"></div><b>Slate</b></button><button class="theme" onclick="theme('light')"><div class="sw" style="background:linear-gradient(135deg,#fff,#d9dee5)"></div><b>Light</b></button><button class="theme" onclick="theme('blue')"><div class="sw" style="background:linear-gradient(135deg,#07111f,#145081)"></div><b>Midnight Blue</b></button></div></div><div class="section"><div class="head"><div><h2>Backup</h2><p>Prototype data is stored on this device until we add shared database storage.</p></div></div><div class="detail"><button class="btn" onclick="backup()">Export backup</button> <button class="btn" onclick="document.getElementById('imp').click()">Import backup</button><input id="imp" type="file" accept="application/json" hidden onchange="restore(event)"></div></div></div><div class="section"><div class="head"><div><h2>Operating model</h2><p>The system is built around the real preparation flow.</p></div></div><div class="list"><div class="item"><b>01 · Intake</b><p>Registration, identity, mileage and first observations.</p></div><div class="item"><b>02 · Initial checks</b><p>Oil, coolant, washer, tyres, lights and obvious defects.</p></div><div class="item"><b>03 · Jobs / repairs</b><p>Mechanical, bodywork and missing-item jobs stay attached to the car.</p></div><div class="item"><b>04 · Valet / prep</b><p>Cleaning and presentation before photography.</p></div><div class="item"><b>05 · Pictures → sale ready</b><p>Clear operational stages with a traceable vehicle record.</p></div></div></div></section>
</main></div><nav id="mobile" class="mobile"></nav>
<script>
const stages=['New intake','Initial checks','Jobs / repairs','Valet / prep','Ready for pictures','Pictures done','Sale ready','On hold'];
const seed=[];
let cars=(JSON.parse(localStorage.getItem('pmgCars')||'[]')||[]).filter(c=>!(c.reg&&['AB12 CDE','YX68 ABC','MK21 XYZ','SJ17 NOP'].includes(c.reg)));
let current=null;
const nav=[['home','⌂','Home'],['scan','📷','Scan'],['stock','▦','Stock'],['mot','✓','MOT'],['intake','＋','New'],['settings','⚙','Settings']];
const $=id=>document.getElementById(id);function save(){localStorage.setItem('pmgCars',JSON.stringify(cars))}function monday(d=new Date()){d=new Date(d);let n=d.getDay();d.setDate(d.getDate()+(n===0?-6:1-n));d.setHours(0,0,0,0);return d}function fmt(d){return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}function wk(d){return monday(new Date(d)).toISOString().slice(0,10)}function openItems(c){return c.jobs.filter(j=>!j.done).length+c.notes.length+(c.checks.coolant==='Low'?1:0)+(c.checks.washer==='Low'?1:0)}function badge(s){let c=s==='Sale ready'||s==='Ready for pictures'||s==='Pictures done'?'good':s==='On hold'?'bad':s==='Jobs / repairs'?'warn':'info';return `<span class="badge ${c}">${s}</span>`}function motBadge(c){if(!c.motExpiry)return '<span class="badge">Not checked</span>';let d=Math.ceil((new Date(c.motExpiry)-new Date())/86400000);return d<0?'<span class="badge bad">MOT expired</span>':d<=30?`<span class="badge warn">${d}d left</span>`:`<span class="badge good">${fmt(c.motExpiry)}</span>`}
function navHtml(active){return nav.map(x=>`<button class="${x[0]===active?'active':''}" onclick="page('${x[0]}')">${x[1]} &nbsp;${x[2]}</button>`).join('')}
function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');$('nav').innerHTML=navHtml(id);$('mobile').innerHTML=navHtml(id);$('title').textContent={home:'Home',scan:'Vehicle scan',stock:'Stock',vehicle:'Vehicle record',mot:'MOT lookup',intake:'New vehicle intake',settings:'Settings'}[id];if(id==='home')homeRender();if(id==='scan')scanInit();if(id==='stock')stockInit();if(id==='vehicle')vehicleRender();scrollTo({top:0,behavior:'smooth'})}
function card(c){return `<div class="card" onclick="openCar(${c.id})"><div class="row"><div><h3>${c.make||'Unknown'} ${c.model||''}</h3><p>${c.reg} · ${c.year||'—'} · ${(c.mileage||0).toLocaleString()} mi</p></div><div class="avatar">🚗</div></div><div class="badges">${badge(c.stage)} ${motBadge(c)}</div><div class="row"><small>${openItems(c)} open</small><small>${fmt(c.intake)}</small></div></div>`}
function homeRender(){
  const start=monday();
  const week=cars.filter(c=>new Date(c.intake)>=start);
  const q=($('hs')?.value||'').toLowerCase();
  const filtered=week.filter(c=>`${c.reg} ${c.make||''} ${c.model||''}`.toLowerCase().includes(q));
  $('cards').innerHTML=filtered.length?filtered.map(card).join(''):'<div class="empty"><b>No vehicles added this week</b><br>Your real stock will appear here after you add the first vehicle.</div>';

  const att=[...cars].filter(c=>openItems(c)).sort((a,b)=>openItems(b)-openItems(a)).slice(0,5);
  $('attention').innerHTML=att.length
    ?att.map(c=>`<div class="item" onclick="openCar(${c.id})"><div class="row"><b>${c.reg} · ${c.make||''} ${c.model||''}</b>${badge(c.stage)}</div><p>${openItems(c)} open item${openItems(c)===1?'':'s'}${c.notes?.length?' · '+c.notes.slice(0,2).join(' · '):''}</p></div>`).join('')
    :'<div class="empty"><b>Nothing needs attention</b><br>Only vehicles you add and flag will appear here.</div>';

  const weekStages=stages.map(s=>({stage:s,count:week.filter(c=>c.stage===s).length})).filter(x=>x.count);
  $('stages').innerHTML=weekStages.length
    ?weekStages.map(x=>`<div class="item"><div class="row"><b>${x.stage}</b><span class="badge">${x.count}</span></div></div>`).join('')
    :'<div class="empty"><b>No workflow data yet</b><br>Add a vehicle to start the weekly board.</div>';

  $('kw').textContent=week.length;
  $('kprep').textContent=week.filter(c=>['Valet / prep','Ready for pictures','Pictures done','Sale ready'].includes(c.stage)).length;
  $('ka').textContent=cars.filter(c=>openItems(c)).length;
  $('kp').textContent=cars.filter(c=>c.stage==='Ready for pictures').length;
  $('ks').textContent=cars.filter(c=>c.stage==='Sale ready').length;
}
function stockInit(){let weeks=[...new Set(cars.map(c=>wk(c.intake)))].sort().reverse();$('wf').innerHTML='<option value="">All intake weeks</option>'+weeks.map(w=>`<option value="${w}">Week of ${fmt(w)}</option>`).join('');$('sf').innerHTML='<option value="">All stages</option>'+stages.map(s=>`<option>${s}</option>`).join('');stockRender()}function stockRender(){let q=($('ss')?.value||'').toLowerCase(),w=$('wf')?.value||'',s=$('sf')?.value||'',a=cars.filter(c=>`${c.reg} ${c.make} ${c.model}`.toLowerCase().includes(q)).filter(c=>!w||wk(c.intake)===w).filter(c=>!s||c.stage===s);$('tbody').innerHTML=a.map(c=>`<tr onclick="openCar(${c.id})"><td><b>${c.make} ${c.model}</b><br><small>${c.reg}</small></td><td>${fmt(c.intake)}</td><td>${badge(c.stage)}</td><td>${motBadge(c)}</td><td>${openItems(c)}</td><td>›</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">No matching vehicles.</div></td></tr>'}
function openCar(id){current=id;page('vehicle')}function vehicleRender(){let c=cars.find(x=>x.id===current);$('vehicleBox').innerHTML=`<div class="detailHead"><div><div class="eyebrow">${c.reg}</div><h2>${c.make} ${c.model}</h2><p>${c.year||'—'} · ${(c.mileage||0).toLocaleString()} miles · ${c.fuel||'—'} · Intake ${fmt(c.intake)}</p></div><div class="actions"><button class="btn" onclick="changeStage()">Change stage</button><button class="btn" onclick="deleteCar()">Delete</button></div></div><div class="tabs"><button class="active" onclick="vtab('overview',this)">Overview</button><button onclick="vtab('checks',this)">Checks</button><button onclick="vtab('issues',this)">Issues & jobs</button><button onclick="vtab('mot',this)">MOT</button></div><div id="vbody" class="detail"></div>`;vtab('overview',document.querySelector('.tabs button'))}
function vtab(t,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active');let c=cars.find(x=>x.id===current),h='';if(t==='overview')h=`<div class="grid3"><div class="mini"><span>Stage</span><b>${c.stage}</b></div><div class="mini"><span>MOT</span><b>${c.motExpiry?fmt(c.motExpiry):'Not checked'}</b></div><div class="mini"><span>Open items</span><b>${openItems(c)}</b></div></div><div class="section"><div class="head"><h2>Information left behind</h2><button class="btn" onclick="note()">＋ Note</button></div><div class="list">${c.notes.map(n=>`<div class="item">${n}</div>`).join('')||'<div class="empty">No notes.</div>'}</div></div>`;if(t==='checks')h=`<div class="grid3">${Object.entries(c.checks).map(x=>`<div class="mini"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><br><button class="btn" onclick="checks()">Update checks</button>`;if(t==='issues')h=`<div class="section"><div class="head"><h2>Jobs</h2><button class="btn" onclick="job()">＋ Job</button></div><div class="list">${c.jobs.map((j,i)=>`<div class="item"><label><input type="checkbox" ${j.done?'checked':''} onchange="toggle(${i})"> <b style="${j.done?'text-decoration:line-through;color:#777':''}">${j.text}</b></label></div>`).join('')||'<div class="empty">No jobs.</div>'}</div></div><div class="section"><div class="head"><h2>Known issues</h2><button class="btn" onclick="note()">＋ Issue</button></div><div class="list">${c.notes.map(n=>`<div class="item">${n}</div>`).join('')||'<div class="empty">No issues.</div>'}</div></div>`;if(t==='mot')h=`<div id="cmot">${c.mot?renderMot(c.mot):'<div class="empty">No MOT record saved.</div>'}</div><button class="btn primary" onclick="motCurrent()">Run DVSA check</button>`;$('vbody').innerHTML=h}
function changeStage(){let c=cars.find(x=>x.id===current),s=prompt('Stage:',c.stage);if(s&&stages.includes(s)){c.stage=s;save();vehicleRender();homeRender()}}function note(){let c=cars.find(x=>x.id===current),n=prompt('What needs remembering?');if(n){c.notes.push(n);save();vehicleRender();homeRender()}}function job(){let c=cars.find(x=>x.id===current),n=prompt('Job to complete:');if(n){c.jobs.push({text:n,done:false});save();vehicleRender();homeRender()}}function toggle(i){let c=cars.find(x=>x.id===current);c.jobs[i].done=!c.jobs[i].done;save();vehicleRender();homeRender()}function checks(){let c=cars.find(x=>x.id===current);for(let k in c.checks){let n=prompt(k,c.checks[k]);if(n!==null)c.checks[k]=n}save();vehicleRender();homeRender()}function deleteCar(){if(confirm('Delete this vehicle?')){cars=cars.filter(x=>x.id!==current);save();page('stock')}}
function renderMot(d){let ts=d.motTests||[];return `<div class="grid3"><div class="mini"><span>Registration</span><b>${d.registration||'—'}</b></div><div class="mini"><span>Make</span><b>${d.make||'—'}</b></div><div class="mini"><span>Fuel</span><b>${d.fuelType||'—'}</b></div></div><div class="list">${ts.slice(0,8).map(t=>`<div class="item"><div class="row"><b>${t.testResult||'MOT'} · ${fmt(t.completedDate)}</b><span class="badge ${t.testResult==='PASSED'?'good':'bad'}">${t.testResult||'—'}</span></div><p>Mileage: ${t.odometerValue||'—'} ${t.odometerUnit||''}<br>${(t.defects||[]).map(d=>`${d.type}: ${d.text}`).join('<br>')}</p></div>`).join('')||'<div class="empty">No MOT tests returned.</div>'}</div>`}
async function runHomeOCR(input){await runOCRCore(input,'homeOcrStatus','homeOcrResult','homeOcrReg')}
async function runOCR(input){$('ocrPreview').classList.remove('hidden');$('ocrImage').src=URL.createObjectURL(input.files?.[0]);await runOCRCore(input,'ocrStatus','ocrResult','ocrReg')}
async function runOCRCore(input,statusId,resultId,regId){
  const file=input.files?.[0];if(!file)return;
  const status=$(statusId),result=$(resultId);result.classList.add('hidden');
  status.innerHTML='<strong>Reading plate…</strong><br>OCR is analysing the image.';
  try{
    if(!window.Tesseract){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('OCR library could not load'));document.head.appendChild(s)})}
    const worker=await Tesseract.createWorker('eng');
    await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',preserve_interword_spaces:'1'});
    const {data}=await worker.recognize(file);await worker.terminate();
    const raw=(data.text||'').toUpperCase().replace(/[^A-Z0-9\s]/g,'');
    const compact=raw.replace(/\s+/g,'');
    const match=compact.match(/[A-Z]{2}[0-9]{2}[A-Z]{3}/);
    if(!match)throw new Error('No UK-style registration was confidently detected. Retake the photo closer and straighter.');
    $(regId).value=match[0];result.classList.remove('hidden');
    status.innerHTML='<strong>Registration detected</strong><br>Check the characters below before using it.';
  }catch(e){status.innerHTML=`<strong>OCR needs another photo</strong><br>${e.message}`}
}
function useHomeOCR(){const reg=$('homeOcrReg').value.trim().toUpperCase();if(!reg)return;$('mr').value=reg;page('mot');motLookup()}
function useOCRRegistration(){const reg=$('ocrReg').value.trim().toUpperCase();if(!reg)return;$('mr').value=reg;page('mot');motLookup()}
function scanInit(){}
async function motLookup(){let reg=$('mr').value.trim();if(!reg)return;$('motOut').innerHTML='<div class="empty">Checking DVSA…</div>';try{let r=await fetch('/api/mot?registration='+encodeURIComponent(reg)),d=await r.json();if(!r.ok)throw Error(d.error||'Lookup failed');$('motOut').innerHTML=renderMot(d)}catch(e){$('motOut').innerHTML=`<div class="empty"><b>Lookup failed</b><br>${e.message}</div>`}}
async function motCurrent(){let c=cars.find(x=>x.id===current);$('mr').value=c.reg;page('mot');await motLookup()}
$('form').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),c={id:Date.now(),reg:String(f.get('reg')).toUpperCase(),make:f.get('make'),model:f.get('model'),year:Number(f.get('year'))||null,mileage:Number(f.get('mileage'))||0,fuel:f.get('fuel'),intake:new Date().toISOString().slice(0,10),stage:'New intake',motExpiry:null,notes:String(f.get('notes')||'').split('\n').map(x=>x.trim()).filter(Boolean),jobs:String(f.get('jobs')||'').split('\n').map(x=>x.trim()).filter(Boolean).map(text=>({text,done:false})),checks:{oil:'Not checked',coolant:'Not checked',washer:'Not checked',tyres:'Not checked'},mot:null};cars.unshift(c);save();stockInit();openCar(c.id)});
function theme(t){let r=document.documentElement;localStorage.setItem('pmgTheme',t);let m={graphite:['#08090b','#111317','#171a20','#292e37','#f5f7fa','#9aa3af'],slate:['#08111d','#0f1a28','#172538','#26374b','#f4f8fc','#9aaec2'],blue:['#07111f','#0b1b2e','#112c47','#1e4164','#f5f9ff','#9eb4ca'],light:['#f4f6f8','#fff','#eef1f5','#d9dee6','#111318','#68707c']}[t];['--bg','--panel','--panel2','--line','--text','--muted'].forEach((k,i)=>r.style.setProperty(k,m[i]))}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cars,null,2)],{type:'application/json'}));a.download='pmg-vehicle-backup.json';a.click()}function restore(e){let r=new FileReader();r.onload=()=>{try{cars=JSON.parse(r.result);save();homeRender();alert('Backup imported')}catch{alert('Invalid backup')}};r.readAsText(e.target.files[0])}
$('date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});theme(localStorage.getItem('pmgTheme')||'graphite');$('nav').innerHTML=navHtml('home');$('mobile').innerHTML=navHtml('home');homeRender();
</script></body></html>
