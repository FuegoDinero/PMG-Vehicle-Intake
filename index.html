<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>PMG Vehicle Intake v2</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#111827;background:#f6f7f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f6f7f9}
body{overscroll-behavior-y:none}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:94px}
header{position:sticky;top:0;z-index:20;background:#f6f7f9f2;backdrop-filter:blur(18px);padding:15px 16px 12px;border-bottom:1px solid #e5e7eb}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:#111827;color:white;display:grid;place-items:center;font-weight:900;font-size:13px}
h1{font-size:20px;line-height:1.1;margin:0}.sub{font-size:12px;color:#6b7280;margin-top:3px}
main{padding:14px 14px 10px}
.card{background:#fff;border:1px solid #e8e9ec;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}
.row{display:flex;gap:9px;align-items:center}.grow{flex:1}
label{display:block;font-size:10px;font-weight:850;color:#6b7280;margin:0 0 6px;text-transform:uppercase;letter-spacing:.07em}
input,select,textarea{width:100%;border:1px solid #d9dce2;border-radius:13px;padding:13px;background:#fff;min-height:48px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#111827;box-shadow:0 0 0 3px #11182712}
button{border:0;border-radius:13px;padding:13px 15px;font-weight:800;min-height:48px;cursor:pointer;touch-action:manipulation}
.primary{background:#111827;color:#fff}.secondary{background:#eef0f3;color:#111827}.danger{background:#fee2e2;color:#991b1b}
.big{font-size:20px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}
.small{font-size:12px}.muted{color:#6b7280}
.badge{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:850;white-space:nowrap}
.ready{background:#dcfce7;color:#166534}.attention{background:#fef3c7;color:#92400e}.mot{background:#fee2e2;color:#991b1b}.neutral{background:#e8eaee;color:#374151}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px;border-radius:14px;background:#f8f9fa}.stat b{display:block;font-size:23px;margin-top:2px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:center;z-index:30;padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px #00000008}
.tabs button{background:transparent;color:#6b7280;flex:1;max-width:240px;min-height:50px;padding:7px 4px;font-size:12px}
.tabs button.active{color:#111827;background:#f0f1f3}
.vehicle{display:flex;gap:12px;align-items:center}.reg{font-weight:950;font-size:19px;letter-spacing:.08em}.meta{font-size:12px;color:#6b7280;margin-top:3px}
.vehicle-card{cursor:pointer}.vehicle-card:active{transform:scale(.995)}
.check{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #f0f1f2}.check:last-child{border-bottom:0}
.switch{width:54px;height:32px;border-radius:20px;background:#d4d7dc;padding:3px;min-height:32px}.switch span{display:block;width:26px;height:26px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px #0002}.switch.on{background:#111827}.switch.on span{transform:translateX(22px)}
.empty{text-align:center;padding:42px 10px;color:#6b7280}
.notice{padding:11px 12px;border-radius:12px;background:#f5f6f8;font-size:12px;color:#4b5563}
.hero{padding:18px}.hero-title{font-size:25px;font-weight:950;margin:4px 0}.section-title{font-size:14px;font-weight:900;margin-bottom:10px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{width:100%}
.back{font-size:13px;padding:9px 11px;min-height:40px}
.camera-wrap{position:relative;overflow:hidden;border-radius:16px;background:#111}.camera-wrap video{display:block;width:100%;height:300px;object-fit:cover}.scan-frame{position:absolute;left:10%;right:10%;top:35%;height:28%;border:2px solid white;border-radius:12px;box-shadow:0 0 0 999px #0005}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #d1d5db;border-top-color:#111827;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:999px;font-size:13px;z-index:50;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
@media(max-width:380px){.grid{grid-template-columns:1fr}.hero-title{font-size:22px}}
</style>
<style>
.home-week{display:flex;gap:8px;overflow:auto;padding-bottom:6px}
.week-card{min-width:105px;border:1px solid #e4e7eb;border-radius:14px;padding:11px;background:#fff}
.week-card.active{box-shadow:0 0 0 2px #111827 inset}
.week-card b{display:block;font-size:20px;margin:3px 0}
.sector-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sector-card{padding:14px;border:1px solid #e4e7eb;border-radius:16px;background:#fff}
.sector-icon{font-size:23px}.sector-title{font-weight:900;margin-top:6px}.sector-count{font-size:23px;font-weight:900}
.info-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info-box{background:#f7f8fa;border-radius:12px;padding:10px}.info-box span{display:block;font-size:10px;color:#6b7280}.info-box b{font-size:17px}
.vehicle-summary{padding:13px 0;border-bottom:1px solid #edf0f2}.vehicle-summary:last-child{border-bottom:0}
.tag{font-size:10px;font-weight:850;border-radius:999px;padding:5px 8px;background:#f0f2f4}.tag.warn{background:#fff3cd}.tag.bad{background:#fee2e2;color:#991b1b}.tag.good{background:#dcfce7;color:#166534}
</style>
<style>
.stage{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#eef0f3;font-size:10px;font-weight:900}
.stage.yard{background:#e0f2fe;color:#075985}.stage.detail{background:#fef3c7;color:#92400e}.stage.sales{background:#dcfce7;color:#166534}
.issue{padding:11px 12px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;margin-top:8px;font-size:12px}
.timeline{border-left:2px solid #e5e7eb;margin:6px 0 4px 7px;padding-left:16px}.timeline-item{position:relative;padding:0 0 14px;font-size:12px}
.timeline-item:before{content:"";position:absolute;left:-22px;top:3px;width:9px;height:9px;border-radius:50%;background:#111827;border:2px solid #fff;box-shadow:0 0 0 1px #d1d5db}
.action{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f1f2}.action:last-child{border-bottom:0}
.pillbar{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.pillbar button{white-space:nowrap;min-height:38px;padding:8px 12px;font-size:11px}
.kicker{font-size:10px;font-weight:900;letter-spacing:.08em;color:#6b7280;text-transform:uppercase}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">PMG</div><div><h1>Vehicle Intake</h1><div class="sub">Vehicle preparation</div></div></div></header>
<main id="main"></main>
<nav class="tabs"><button id="dashTab" class="active" onclick="go('dashboard')">Vehicles</button><button id="addTab" onclick="go('add')">+ Add</button></nav>
</div>
<script>
const KEY='pmg_vehicle_intake_v2';
let vehicles=JSON.parse(localStorage.getItem(KEY)||'[]'), currentId=null, toastTimer;
const checks=[['oil','Oil'],['coolant','Coolant'],['washer','Washer fluid'],['tyres','Tyres'],['lights','Lights'],['condition','General condition'],['cleaned','Cleaned'],['photographed','Photographed']];

function save(){localStorage.setItem(KEY,JSON.stringify(vehicles))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function norm(s){return s.toUpperCase().replace(/[^A-Z0-9]/g,'')}
function daysTo(d){if(!d)return null;return Math.ceil((new Date(d+'T23:59:59')-new Date())/86400000)}
function motState(v){
 if(!v.motExpiry)return['neutral','MOT not found'];
 const n=daysTo(v.motExpiry);
 if(n<0)return['mot','MOT EXPIRED'];
 if(n<=30)return['attention',`MOT expires in ${n} day${n===1?'':'s'}`];
 return['ready','MOT valid'];
}
function overall(v){
 if(motState(v)[0]==='mot')return['mot','MOT issue'];
 if(checks.some(([k])=>!v.checks?.[k]))return['attention','Needs attention'];
 return['ready','Ready'];
}

/* Provider boundary:
   Replace demoVehicleLookup() with the backend call once DVLA/vehicle-data API credentials exist.
   The UI never needs to change. */
const DEMO={
 'AB12CDE':{make:'Volkswagen',model:'Golf',variant:'1.5 TSI',fuel:'Petrol',gearbox:'Manual',year:'2021',colour:'White',engine:'1498cc',motExpiry:'2027-03-14',motLastTest:'2026-03-15',motResult:'PASSED',mileage:'42,381',advisories:[]},
 'AR09LPV':{make:'Audi',model:'A6 RS6 Avant TFSI Quattro',variant:'',fuel:'Petrol',gearbox:'DSG',year:'2009',colour:'Black',engine:'3993cc',motExpiry:'2027-05-16',motLastTest:'2026-05-16',motResult:'PASSED',mileage:'88,210',advisories:[]},
 'SE38GUW':{make:'Renault',model:'Clio',variant:'',fuel:'Diesel',gearbox:'Manual',year:'2003',colour:'Blue',engine:'1461cc',motExpiry:'2017-06-28',motLastTest:'2017-03-10',motResult:'PASSED',mileage:'133,230',advisories:['Rear brake pad(s) wearing thin']},
};
async function demoVehicleLookup(reg){
 await new Promise(r=>setTimeout(r,650));
 return DEMO[reg] || null;
}
function go(tab){document.getElementById('dashTab').classList.toggle('active',tab==='dashboard');document.getElementById('addTab').classList.toggle('active',tab==='add');currentId=null;render(tab)}
function render(tab='dashboard'){
 const el=document.getElementById('main');
 if(tab==='add')return renderAdd(el);
 if(currentId)return renderVehicle(el,currentId);
 const c={ready:0,attention:0,mot:0};vehicles.forEach(v=>c[overall(v)[0]]++);
 el.innerHTML=`<div class="card hero"><div class="small muted">TODAY'S WORK</div><div class="hero-title">${vehicles.length} vehicle${vehicles.length===1?'':'s'}</div><div class="small muted">Keep the intake moving one car at a time.</div><div class="quick" style="margin-top:14px"><button class="primary" onclick="go('add')">＋ Add vehicle</button><button class="secondary" onclick="go('add');setTimeout(startScan,100)">📷 Scan plate</button></div></div>
 <div class="card"><div class="section-title">Status</div><div class="grid"><div class="stat"><span class="small muted">READY</span><b>${c.ready}</b></div><div class="stat"><span class="small muted">ATTENTION</span><b>${c.attention}</b></div><div class="stat"><span class="small muted">MOT ISSUES</span><b>${c.mot}</b></div><div class="stat"><span class="small muted">TOTAL</span><b>${vehicles.length}</b></div></div></div>
 ${vehicles.length?vehicles.map(card).join(''):'<div class="empty">No vehicles yet.<br>Add a registration to begin.</div>'}`;
}
function card(v){let[o,ot]=overall(v),[m,mt]=motState(v);return `<div class="card vehicle-card" onclick="openV('${v.id}')"><div class="vehicle"><div class="grow"><div class="reg">${esc(v.reg)}</div><div class="meta">${esc(v.make||'Vehicle')} ${esc(v.model||'')}</div></div><span class="badge ${o}">${ot}</span></div><div class="row" style="margin-top:10px"><span class="badge ${m}">${mt}</span><span class="small muted">${v.motExpiry?'Expiry '+esc(v.motExpiry):'MOT not retrieved'}</span><span class="grow"></span><span class="small muted">${checks.filter(([k])=>v.checks?.[k]).length}/8</span></div></div>`}
let scanStream=null;
async function startScan(){
 const box=document.getElementById('scanBox'), msg=document.getElementById('ocrMsg');
 box.classList.remove('hidden');
 try{
   scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
   document.getElementById('camera').srcObject=scanStream;
   msg.innerHTML='Camera ready. Aim at the plate and tap <b>Capture plate</b>.';
 }catch(e){msg.textContent='Camera access was blocked. Allow camera permission, or enter the registration manually.';}
}
function stopScan(){
 if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
 document.getElementById('scanBox')?.classList.add('hidden');
}
async function captureFrame(){
 const video=document.getElementById('camera'), canvas=document.getElementById('frame'), msg=document.getElementById('ocrMsg');
 if(!video.videoWidth){msg.textContent='Camera is not ready yet.';return}
 canvas.width=video.videoWidth;canvas.height=video.videoHeight;
 canvas.getContext('2d').drawImage(video,0,0);
 msg.innerHTML='<span class="spinner"></span>Reading plate...';
 try{
   if('BarcodeDetector' in window){
     const detector=new BarcodeDetector();
     const codes=await detector.detect(canvas);
     const candidate=codes.find(x=>/^[A-Z0-9 ]{2,10}$/i.test((x.rawValue||'').replace(/[^A-Z0-9 ]/gi,'')));
     if(candidate){
       const reg=norm(candidate.rawValue);
       document.getElementById('reg').value=reg;
       msg.innerHTML=`Possible registration: <b>${esc(reg)}</b><br>Check it, then tap <b>Find vehicle</b>.`;
       stopScan();return;
     }
   }
 }catch(e){}
 msg.innerHTML='Plate captured. Dedicated UK plate OCR/ANPR is not connected yet. Enter or correct the registration below.';
 const input=document.getElementById('reg');input.focus();input.select();
}

const STAGES={yard:{label:"Yard intake",cls:"yard",icon:"🚚"},detailing:{label:"Detailing",cls:"detail",icon:"🧽"},sales:{label:"Sales / action",cls:"sales",icon:"💼"},ready:{label:"Ready for sale",cls:"sales",icon:"✅"}};
const CONDITION_ITEMS=[["clutch","Clutch"],["gearbox","Gearbox"],["engineSounds","Engine sounds"],["smells","Unusual smells"],["leaks","Leaks"],["tyres","Tyres"],["lights","Lights"]];
function ensureWorkflow(v){v.stage=v.stage||"yard";v.timeline=v.timeline||[];v.conditions=v.conditions||{};v.body=v.body||{};v.actions=v.actions||{mot:false,service:false,repair:false,bodyshop:false};v.detail=v.detail||{};return v}
function saveVehicle(v){ensureWorkflow(v);localStorage.setItem("vehicles",JSON.stringify(vehicles))}
function addTimeline(v,text){ensureWorkflow(v);v.timeline.unshift({time:new Date().toLocaleString([],{dateStyle:"short",timeStyle:"short"}),text});saveVehicle(v)}
function stageBadge(v){let s=STAGES[v.stage]||STAGES.yard;return `<span class="stage ${s.cls}">${s.icon} ${s.label}</span>`}
function vehicleIssues(v){ensureWorkflow(v);let a=[];if(v.motExpiry){let d=Math.ceil((new Date(v.motExpiry)-new Date())/86400000);if(d<0)a.push("MOT expired");else if(d<=30)a.push(`MOT expires in ${d} days`)}Object.entries(v.conditions).forEach(([k,val])=>{if(["attention","fault","replace","present"].includes(val))a.push((CONDITION_ITEMS.find(x=>x[0]===k)||[k,k])[1])});Object.entries(v.body).forEach(([k,val])=>{if(["attention","damage"].includes(val))a.push(`Body: ${k.replace(/_/g," ")}`)});Object.entries(v.actions).forEach(([k,val])=>{if(val)a.push(k==="mot"?"MOT action":k==="service"?"Service":k==="repair"?"Repair":"Body shop")});return a}
function workflowCounts(){let c={yard:0,detailing:0,sales:0,ready:0,attention:0};vehicles.forEach(v=>{ensureWorkflow(v);c[v.stage]=(c[v.stage]||0)+1;if(vehicleIssues(v).length)c.attention++});return c}
function renderWorkflowDashboard(el){let c=workflowCounts();el.innerHTML=`<div class="card hero"><div class="kicker">PMG WORKFLOW</div><div class="hero-title">Where are the cars?</div><div class="small muted">Every vehicle has one live record and a clear next action.</div></div><div class="card"><div class="section-title">Pipeline</div><div class="grid"><div class="stat"><span class="small muted">🚚 YARD</span><b>${c.yard}</b></div><div class="stat"><span class="small muted">🧽 DETAILING</span><b>${c.detailing}</b></div><div class="stat"><span class="small muted">💼 SALES ACTION</span><b>${c.sales}</b></div><div class="stat"><span class="small muted">✅ READY</span><b>${c.ready}</b></div></div></div><div class="card"><div class="section-title">Attention</div><div class="row"><span class="grow"><b>${c.attention}</b> vehicles need attention</span><button class="secondary" onclick="filterStage='attention';page='vehicles';render()">View</button></div></div><div class="card"><div class="section-title">Quick actions</div><div class="quick"><button class="primary" onclick="go('add')">＋ New vehicle</button><button class="secondary" onclick="page='vehicles';filterStage='all';render()">🚗 All vehicles</button></div></div>`}
let filterStage="all";
function renderVehicleList(el){let list=vehicles.filter(v=>{ensureWorkflow(v);return filterStage==="all"||filterStage==="attention"?filterStage==="all"?true:vehicleIssues(v).length>0:v.stage===filterStage});el.innerHTML=`<div class="row" style="margin-bottom:10px"><div class="grow"><h2 style="margin:0;font-size:21px">Vehicles</h2><div class="small muted">${list.length} shown</div></div><button class="primary" onclick="go('add')">＋ Add</button></div><div class="pillbar">${["all","yard","detailing","sales","ready","attention"].map(x=>`<button class="${filterStage===x?'primary':'secondary'}" onclick="filterStage='${x}';render()">${x==="all"?"All":x==="yard"?"Yard":x==="detailing"?"Detailing":x==="sales"?"Sales":x==="ready"?"Ready":"⚠️ Attention"}</button>`).join("")}</div>${list.length?list.map(v=>`<div class="card vehicle-card" onclick="openV('${v.id}')"><div class="vehicle"><div class="grow"><div class="reg">${esc(v.reg||"NO REG")}</div><div class="meta">${esc(v.make||"Vehicle")} ${esc(v.model||"")} • ${esc(v.mileage||"Mileage not entered")}</div></div>${stageBadge(v)}</div>${vehicleIssues(v).slice(0,3).map(i=>`<div class="issue">⚠️ ${esc(i)}</div>`).join("")}</div>`).join(""):`<div class="empty">No vehicles in this view.</div>`}`}
function currentVehicle(){return vehicles.find(x=>x.id===currentId)}
function moveStage(v,next){ensureWorkflow(v);v.stage=next;addTimeline(v,`${STAGES[next].icon} Moved to ${STAGES[next].label}`);showToast(`${v.reg} moved to ${STAGES[next].label}`);render()}
function setCondition(v,k,val){ensureWorkflow(v);v.conditions[k]=val;saveVehicle(v);if(!["ok","none"].includes(val))addTimeline(v,`${k}: ${val}`)}
function setAction(k){let v=currentVehicle();v.actions[k]=!v.actions[k];saveVehicle(v);if(v.actions[k])addTimeline(v,`Sales action required: ${k}`);render()}
function setBody(k,val){let v=currentVehicle();v.body[k]=val;saveVehicle(v);if(val!=="good")addTimeline(v,`Body condition: ${k.replace(/_/g," ")} = ${val}`);render()}
function togglePictures(){let v=currentVehicle();v.detail.readyForPictures=!v.detail.readyForPictures;saveVehicle(v);addTimeline(v,v.detail.readyForPictures?"📸 Ready for pictures":"Picture readiness removed");render()}
function renderWorkflowVehicle(el,v){ensureWorkflow(v);let issues=vehicleIssues(v);let conditions=CONDITION_ITEMS.map(([k,l])=>`<div class="check"><div><b>${l}</b><div class="small muted">${v.conditions[k]||"ok"}</div></div><select style="max-width:145px" onchange="setCondition(currentVehicle(),'${k}',this.value)">${["ok","attention","fault","replace","present","none"].map(x=>`<option value="${x}" ${(v.conditions[k]||"ok")===x?"selected":""}>${x[0].toUpperCase()+x.slice(1)}</option>`).join("")}</select></div>`).join("");let body=["Front bumper","Rear bumper","Bonnet","Roof","Doors","Wings","Wheels","Glass"].map(l=>{let k=l.toLowerCase().replace(/ /g,"_");return `<div class="check"><b>${l}</b><select style="max-width:145px" onchange="setBody('${k}',this.value)">${["good","attention","damage"].map(x=>`<option value="${x}" ${(v.body[k]||"good")===x?"selected":""}>${x[0].toUpperCase()+x.slice(1)}</option>`).join("")}</select></div>`}).join("");let acts={mot:"Book MOT",service:"Service",repair:"Mechanical repair",bodyshop:"Body shop"};el.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="secondary back" onclick="currentId=null;render()">‹ Vehicles</button><span class="grow"></span>${stageBadge(v)}</div><div class="card hero"><div class="kicker">${esc(v.reg||"NO REG")}</div><div class="hero-title">${esc((v.make||"Vehicle")+" "+(v.model||""))}</div><div class="small muted">Mileage: ${esc(v.mileage||"Not entered")}</div>${issues.length?`<div class="issue"><b>⚠️ ${issues.length} attention item${issues.length>1?"s":""}</b><div class="small">${issues.map(esc).join(" • ")}</div></div>`:"<div class='notice' style='margin-top:12px'>No current attention flags.</div>"}</div><div class="card"><div class="section-title">Move vehicle</div><div class="quick">${v.stage==="yard"?`<button class="primary" onclick="moveStage(v,'detailing')">🧽 Send to detailers</button>`:""}${v.stage==="detailing"?`<button class="primary" onclick="moveStage(v,'sales')">💼 Send to sales</button>`:""}${v.stage==="sales"?`<button class="primary" onclick="moveStage(v,'ready')">✅ Ready for sale</button>`:""}${v.stage!=="yard"?`<button class="secondary" onclick="moveStage(v,'yard')">↩ Return to yard</button>`:""}</div></div>${v.stage==="yard"?`<div class="card"><div class="section-title">🔍 Yard condition</div>${conditions}</div>`:""}${v.stage==="detailing"?`<div class="card"><div class="section-title">🧽 Body condition</div>${body}</div><div class="card"><div class="section-title">📸 Picture readiness</div><div class="check"><div><b>Ready for pictures</b><div class="small muted">Final visual check complete.</div></div><button class="switch ${v.detail.readyForPictures?'on':''}" onclick="togglePictures()"><span></span></button></div></div>`:""}<div class="card"><div class="section-title">💼 Sales actions</div>${Object.entries(acts).map(([k,l])=>`<div class="action"><div><b>${l}</b><div class="small muted">${v.actions[k]?"Required":"No action marked"}</div></div><button class="switch ${v.actions[k]?'on':''}" onclick="setAction('${k}')"><span></span></button></div>`).join("")}</div><div class="card"><div class="section-title">📜 Vehicle timeline</div><div class="timeline">${(v.timeline||[]).slice(0,12).map(t=>`<div class="timeline-item"><b>${esc(t.text)}</b><div class="small muted">${esc(t.time)}</div></div>`).join("")}</div></div>`}
function showToast(msg){let d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}


let selectedWeek="all", selectedSector="all";
function pmgWeek(d){let x=new Date(d);let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x.toISOString().slice(0,10)}
function pmgWeekLabel(k){let d=new Date(k+"T00:00:00"),e=new Date(d);e.setDate(e.getDate()+6);return d.toLocaleDateString([], {day:"numeric",month:"short"})+" – "+e.toLocaleDateString([], {day:"numeric",month:"short"})}
function pmgBaseList(){return vehicles.filter(v=>{ensureWorkflow(v);return selectedWeek==="all"||pmgWeek(v.createdAt||Date.now())===selectedWeek})}
function pmgList(){let a=pmgBaseList();if(selectedSector==="yard")return a.filter(v=>v.stage==="yard");if(selectedSector==="detailing")return a.filter(v=>v.stage==="detailing");if(selectedSector==="sales")return a.filter(v=>v.stage==="sales");if(selectedSector==="ready")return a.filter(v=>v.stage==="ready");if(selectedSector==="attention")return a.filter(v=>vehicleIssues(v).length);return a}
function pmgSummary(v){let issues=vehicleIssues(v),jobs=[];if(v.actions?.mot)jobs.push("MOT");if(v.actions?.service)jobs.push("Service");if(v.actions?.repair)jobs.push("Repair");if(v.actions?.bodyshop)jobs.push("Body shop");return `<div class="vehicle-summary" onclick="openV('${v.id}')"><div class="row"><div class="grow"><b>${esc(v.reg||"NO REG")}</b><div class="small muted">${esc((v.make||"Vehicle")+" "+(v.model||""))}</div></div>${stageBadge(v)}</div><div class="status-line">${issues.slice(0,3).map(x=>`<span class="tag bad">⚠️ ${esc(x)}</span>`).join("")}${jobs.map(x=>`<span class="tag warn">🔧 ${x}</span>`).join("")}${!issues.length&&!jobs.length?'<span class="tag good">No issues</span>':""}</div></div>`}
function pmgHome(el){
  vehicles.forEach(ensureWorkflow);let c=workflowCounts(),all=pmgBaseList(),attention=vehicles.filter(v=>vehicleIssues(v).length).length;
  let now=new Date(),base=new Date(now);base.setDate(base.getDate()-((base.getDay()+6)%7));
  let weeks=[0,1,2,3,4].map(i=>{let d=new Date(base);d.setDate(d.getDate()-i*7);return pmgWeek(d)});
  let sectors=[["yard","🚚","Yard",c.yard],["detailing","🧽","Detailing",c.detailing],["sales","💼","Sales jobs",c.sales],["ready","📸","Ready",c.ready],["attention","⚠️","Attention",attention],["all","🚗","All stock",vehicles.length]];
  el.innerHTML=`<div class="card hero"><div class="kicker">PMG STOCK CONTROL</div><div class="hero-title">Stock overview</div><div class="small muted">See new stock by week, where each car is and everything left behind.</div></div>
  <div class="card"><div class="section-title">New stock — week starting Monday</div><div class="home-week"><div class="week-card ${selectedWeek==="all"?"active":""}" onclick="selectedWeek='all';render()"><span class="small muted">ALL</span><b>${vehicles.length}</b><span class="small muted">stock</span></div>${weeks.map(k=>{let n=vehicles.filter(v=>pmgWeek(v.createdAt||Date.now())===k).length;return `<div class="week-card ${selectedWeek===k?"active":""}" onclick="selectedWeek='${k}';render()"><span class="small muted">W/C</span><b>${n}</b><span class="small muted">${pmgWeekLabel(k)}</span></div>`}).join("")}</div></div>
  <div class="card"><div class="section-title">Departments</div><div class="sector-grid">${sectors.map(s=>`<div class="sector-card" onclick="selectedSector='${s[0]}';page='vehicles';render()"><div class="sector-icon">${s[1]}</div><div class="sector-title">${s[2]}</div><div class="sector-count">${s[3]}</div><div class="small muted">View cars</div></div>`).join("")}</div></div>
  <div class="card"><div class="section-title">This week's control panel</div><div class="info-list"><div class="info-box"><span>NEW THIS WEEK</span><b>${vehicles.filter(v=>pmgWeek(v.createdAt||Date.now())===pmgWeek(Date.now())).length}</b></div><div class="info-box"><span>ATTENTION</span><b>${attention}</b></div><div class="info-box"><span>JOBS</span><b>${vehicles.filter(v=>Object.values(v.actions||{}).some(Boolean)).length}</b></div><div class="info-box"><span>READY</span><b>${c.ready}</b></div></div></div>
  <div class="card"><div class="section-title">Recent stock</div>${all.slice(0,10).map(pmgSummary).join("")||'<div class="empty">No vehicles yet.</div>'}</div>
  <div class="card"><button class="primary" style="width:100%" onclick="go('add')">＋ Add vehicle</button></div>`;
}
function pmgVehicleList(el){
  let a=pmgList(),title=selectedSector==="yard"?"Yard":selectedSector==="detailing"?"Detailing":selectedSector==="sales"?"Sales jobs":selectedSector==="ready"?"Ready":selectedSector==="attention"?"Attention":"All stock";
  el.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="secondary" onclick="page='home';selectedSector='all';render()">‹ Home</button><div class="grow"><b>${title}</b><div class="small muted">${a.length} vehicles</div></div><button class="primary" onclick="go('add')">＋ Add</button></div><div class="pillbar">${["all","yard","detailing","sales","ready","attention"].map(x=>`<button class="${selectedSector===x?"primary":"secondary"}" onclick="selectedSector='${x}';render()">${x==="all"?"All":x==="yard"?"Yard":x==="detailing"?"Detailing":x==="sales"?"Sales":x==="ready"?"Ready":"⚠️ Attention"}</button>`).join("")}</div><div class="card">${a.map(pmgSummary).join("")||'<div class="empty">No vehicles in this view.</div>'}</div>`}

function renderAdd(el){el.innerHTML=`<div class="card"><label>Registration</label>
<div class="row"><input id="reg" class="big" placeholder="AB12 CDE" autocomplete="off" autocapitalize="characters" enterkeyhint="go" onkeydown="if(event.key==='Enter')lookup()"><button class="primary" onclick="lookup()">Find vehicle</button></div>
<div class="row" style="margin-top:10px"><button class="secondary grow" onclick="startScan()">📷 Scan plate</button></div>
<div class="small muted" style="margin-top:8px">Scan the plate, confirm the registration, then find the vehicle.</div>
<div id="scanBox" class="hidden" style="margin-top:12px"><div class="camera-wrap"><video id="camera" autoplay playsinline muted></video><div class="scan-frame"></div></div>
<div class="row" style="margin-top:8px"><button class="secondary grow" onclick="captureFrame()">Capture plate</button><button class="danger" onclick="stopScan()">Close</button></div>
<canvas id="frame" class="hidden"></canvas>
<div id="ocrMsg" class="notice" style="margin-top:8px">Point the camera at the number plate. Keep the plate inside the frame.</div></div>
<div id="lookupMsg" class="hidden notice" style="margin-top:12px"></div></div><div class="card"><b>Lookup flow</b><div class="small muted" style="margin-top:7px">Registration → vehicle data → MOT → preparation checklist</div></div>`;setTimeout(()=>document.getElementById('reg')?.focus(),50)}
async function lookup(){
 const reg=norm(document.getElementById('reg').value);const msg=document.getElementById('lookupMsg');if(reg.length<2){toast('Enter a registration');return}
 msg.classList.remove('hidden');msg.innerHTML='<span class="spinner"></span>Finding vehicle and MOT...';
 const data=await demoVehicleLookup(reg);
 if(!data){msg.innerHTML='No demo vehicle found. The live provider connection is not connected yet.';return}
 if(vehicles.some(v=>v.reg===reg)){currentId=vehicles.find(v=>v.reg===reg).id;render();return}
 const v={id:crypto.randomUUID(),reg,...data,checks:{},notes:'',provider:'demo',createdAt:new Date().toISOString()};
 vehicles.unshift(v);save();currentId=v.id;render();
}
function openV(id){currentId=id;page='vehicles';render()}
function renderVehicle(el,id){
 const v=vehicles.find(x=>x.id===id);if(!v){currentId=null;return render()}
 const[o,ot]=overall(v),[m,mt]=motState(v);
 el.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="secondary back" onclick="currentId=null;render()">‹ Vehicles</button><span class="grow"></span><button class="danger back" onclick="delV('${v.id}')">Delete</button></div>
 <div class="card"><div class="vehicle"><div class="grow"><div class="reg">${esc(v.reg)}</div><div class="meta">${esc(v.make)} ${esc(v.model)} ${esc(v.variant)}</div></div><span class="badge ${o}">${ot}</span></div></div>
 <div class="card"><b>Vehicle found</b><div class="grid" style="margin-top:12px"><div><label>Make</label><input value="${esc(v.make)}" readonly></div><div><label>Model</label><input value="${esc(v.model)}" readonly></div><div><label>Fuel</label><input value="${esc(v.fuel)}" readonly></div><div><label>Gearbox</label><input value="${esc(v.gearbox)}" readonly></div><div><label>Year</label><input value="${esc(v.year)}" readonly></div><div><label>Colour</label><input value="${esc(v.colour)}" readonly></div></div></div>
 <div class="card"><div class="row"><div class="grow"><b>MOT</b><div class="small muted">Retrieved with the vehicle lookup in this prototype</div></div><span class="badge ${m}">${mt}</span></div><div class="grid" style="margin-top:12px"><div><label>Result</label><input value="${esc(v.motResult||'Not available')}" readonly></div><div><label>Expiry</label><input type="date" value="${esc(v.motExpiry)}" onchange="field('${v.id}','motExpiry',this.value)"></div><div><label>Last test</label><input type="date" value="${esc(v.motLastTest)}" readonly></div><div><label>Mileage</label><input value="${esc(v.mileage||'')}" readonly></div></div>${v.advisories?.length?`<div class="notice" style="margin-top:12px"><b>Advisories</b><br>${v.advisories.map(esc).join('<br>')}</div>`:''}</div>
 <div class="card"><b>Preparation checklist</b>${checks.map(([k,n])=>`<div class="check"><span>${n}</span><button class="switch ${v.checks?.[k]?'on':''}" onclick="toggle('${v.id}','${k}')"><span></span></button></div>`).join('')}</div>
 <div class="card"><label>Notes</label><textarea onchange="field('${v.id}','notes',this.value)">${esc(v.notes)}</textarea></div>
 <div class="card"><div class="notice">🧪 <b>Prototype status:</b> vehicle lookup is currently using demo records. The next connection replaces this provider with the approved live API; the screen stays the same.</div></div>`;
}
function field(id,k,val){let v=vehicles.find(x=>x.id===id);v[k]=val;save();renderVehicle(document.getElementById('main'),id)}
function toggle(id,k){let v=vehicles.find(x=>x.id===id);v.checks[k]=!v.checks[k];save();renderVehicle(document.getElementById('main'),id)}
function delV(id){if(!confirm('Delete this vehicle?'))return;vehicles=vehicles.filter(v=>v.id!==id);save();currentId=null;render()}
function toast(msg){clearTimeout(toastTimer);const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);toastTimer=setTimeout(()=>t.remove(),2200)}
render();
</script>
</body>
</html>
